name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
