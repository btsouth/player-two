[project]
name = "player-two"
version = "0.1.0"
description = "An AI co-op partner that sees the screen and plays by voice, for blind, low-vision and motor-impaired gamers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "websockets>=13",
    "numpy>=1.26",
    "pillow>=10",
    "kokoro-onnx>=0.4",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "evdev>=1.7; sys_platform == 'linux'",
    # The GPU build also runs on the CPU, so x86_64 Linux and Windows always get it.
    "onnxruntime-gpu>=1.23; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "onnxruntime>=1.20; platform_machine != 'x86_64' and platform_machine != 'AMD64'",
]

[project.optional-dependencies]
windows = ["mss>=9", "vgamepad>=0.1"]
# CUDA and cuDNN as pip wheels, for NVIDIA cards without a system CUDA install.
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.23"]

[project.scripts]
player-two = "playertwo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
# kokoro-onnx asks for the CPU-only onnxruntime; on x86_64 the GPU build replaces it.
override-dependencies = [
    "onnxruntime>=1.20; platform_machine != 'x86_64' and platform_machine != 'AMD64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playertwo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "SIM", "RUF", "UP", "I"]
ignore = ["B023", "RUF001", "RUF002"]
